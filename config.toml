# The URL the site will be built for
base_url = "https://dorotaparad.ch"
title = "Value Added Thoughts"
description = "Dorota Parad's blog"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

theme = "Ergo"
#highlight_theme = "solarized-light"
generate_feeds = true
feed_filenames = ["atom.xml"]
feed_limit = 20

[markdown]
# Whether external links are to be opened in a new tab
# If this is true, a `rel="noopener"` will always automatically be added for security reasons
external_links_target_blank = true

[extra]
# Put all your custom variables here
# theme options
profile = "profile.svg" # the name of the profile picture in static/img/
color_themes = ["default", "dark"]
country_flags = true # Display languages as country flags. Defaults to false.

[extra.banner]
default_image = "img/default-banner.jpg"
default_alt = "Placeholder image: clean, abstract drawing of horizontal lines and circles evoking a vague impression of a diagram or a circuit board"

# Variables from the theme
[[extra.socials]]
icon = "bluesky"
icon_class = "fa-brands fa-bluesky"
display = ""
uri = "https://bsky.app/profile/dorotaparad.bsky.social"

[[extra.socials]]
icon = "linkedin"
icon_class = "fa-brands fa-linkedin"
display = ""
uri = "https://www.linkedin.com/in/dorota-parad/"

[extra.font_awesome]
kit = "fc233bb6f8"
